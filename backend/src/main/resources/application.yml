spring:
  application:
    name: carequeue
  config:
    # When the app runs from backend/, the repo-root .env (e.g. GROQ_API_KEY) is read as properties.
    # Optional: ignored when the file does not exist (CI, Docker, tests in a fresh checkout).
    import: optional:file:../.env[.properties]
  datasource:
    # Full URL (docker compose, local overrides) or, when it is not set, built from DB_HOST / DB_PORT /
    # DB_NAME: Render's Blueprint exposes the database host, port and name separately (render.yaml).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carequeue}}
    username: ${SPRING_DATASOURCE_USERNAME:carequeue}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      org.hibernate.envers.audit_table_suffix: _aud
      org.hibernate.envers.revision_field_name: rev
      org.hibernate.envers.revision_type_field_name: revtype
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  ai:
    # AI triage talks to Groq through Spring AI's OpenAI-compatible client (ADR-007).
    openai:
      # Blank key = AI triage disabled: the app still starts and every suggestion comes from the
      # rule-based client, without any HTTP call (see TriageConfig / ResilientTriageAiClient).
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      timeout: 20s
      # Exactly one retry layer: ours (@Retryable on SpringAiTriageAiClient). The OpenAI SDK's own
      # retries are switched off here.
      max-retries: 0
      chat:
        # Provisional default; the evals decide the final model.
        model: ${CAREQUEUE_TRIAGE_MODEL:llama-3.3-70b-versatile}
        temperature: 0
        # JSON mode: response_format {"type": "json_object"}.
        response-format:
          type: JSON_OBJECT
    retry:
      # Spring AI's RetryTemplate auto-configuration is not active in 2.1 with this starter
      # (spring-ai-retry is not on the classpath, and OpenAiChatModel does not use it).
      # 0 keeps it off if that module is ever added.
      max-attempts: 0
    model:
      # Only the chat model is used; don't create the other OpenAI model beans.
      embedding: none
      image: none
      moderation: none
      decision: none
      audio:
        speech: none
        transcription: none

server:
  # Render injects PORT; locally and in docker compose it is 8080.
  port: ${PORT:8080}
  # Render (and any reverse proxy) terminates TLS and sends X-Forwarded-Proto/Host. "framework" makes
  # Spring see the original https request (correct redirects, HSTS header) and strips those headers.
  forward-headers-strategy: framework
  # Finish in-flight requests on SIGTERM (a redeploy) instead of cutting them off.
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: CareQueue
    description: Synthetic GP referral and clinic waiting-list manager

carequeue:
  security:
    nurse-password: ${CAREQUEUE_NURSE_PASSWORD:}
    manager-password: ${CAREQUEUE_MANAGER_PASSWORD:}
  triage:
    # Prompt file in src/main/resources/prompts/. Changing the prompt = a new version file.
    prompt-version: triage-v1
    retry:
      # Transient failures only (timeouts/IO, HTTP 429, HTTP 5xx): 1 call + 2 retries, 500ms then 1s.
      max-retries: 2
      delay: 500ms
      multiplier: 2
